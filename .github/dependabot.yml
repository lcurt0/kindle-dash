# Propone actualizaciones como pull requests, una vez por mes y agrupadas,
# para revisar antes de aceptar. Nada se actualiza solo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Dependencias internas de Playwright: las fija Playwright mismo
    # (pyee<15, greenlet<4). Se actualizan al actualizar Playwright.
    ignore:
      - dependency-name: pyee
      - dependency-name: greenlet
    groups:
      python:
        patterns: ["*"]
