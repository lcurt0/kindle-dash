name: Render dashboard

on:
  # Cada 30 min de 05:00 a 22:30 UTC = 06:00–23:30 en Madrid (invierno)
  # y 07:00–00:30 (verano). De noche no se renderiza: el Kindle duerme.
  schedule:
    - cron: "0,30 5-22 * * *"
  workflow_dispatch:      # botón "Run workflow" para forzar una actualización
  push:
    branches: [main]

# Por defecto, ningún permiso. Cada job pide solo lo que usa.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Acciones fijadas a un commit exacto (no a una etiqueta que pueda moverse).
# Dependabot propone las actualizaciones como PR.
jobs:
  build:
    runs-on: ubuntu-24.04        # versión fija: ubuntu-latest cambia sin aviso
    timeout-minutes: 15
    permissions:
      contents: write            # solo para el commit de keepalive
    outputs:
      publish: ${{ steps.render.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Fuente Inter local (sin depender de Google Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-inter
          fc-list | grep -q "Inter" || { echo "Falta la fuente Inter"; exit 1; }

      - name: Caché del navegador de render
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Chromium
        run: python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q tests

      - name: Render
        id: render
        run: |
          set +e
          python build.py
          code=$?
          if [ $code -eq 0 ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          # 3 = sin datos de red: no es un error, simplemente no se publica.
          [ $code -eq 0 ] || [ $code -eq 3 ]

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.render.outputs.publish == 'true'
        with:
          path: out

      # GitHub apaga los workflows programados de repos sin actividad
      # durante 60 días. Un commit mínimo cada ~45 días lo evita.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "kindle-dash-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive [skip ci]"
            git push
          fi

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
