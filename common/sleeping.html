<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1072px; height:1448px; background:#fff; color:#000; font-family:"Inter",sans-serif; }
  .page { height:100%; padding:64px 72px 56px; display:flex; flex-direction:column; }
  .kicker { font-size:24px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    padding-bottom:28px; border-bottom:6px solid #000; }
  .mid { margin:auto 0; }
  /* Luna por sombra: sin bordes grises de recorte */
  .moon { width:110px; height:110px; border-radius:50%; margin:0 0 56px 34px; box-shadow:-34px 16px 0 0 #000; }
  h1 { font-family:"Inter Display","Inter"; font-size:112px; font-weight:700; letter-spacing:-.03em; line-height:.95; }
  p { font-size:36px; color:#555; font-weight:500; margin-top:28px; line-height:1.3; }
  footer { font-size:20px; color:#555; font-weight:500; padding-top:18px; border-top:3px solid #000; }
</style></head>
<body><div class="page">
  <div class="kicker">Lo justo</div>
  <div class="mid">
    <div class="moon"></div>
    <h1>Fuera de<br>horario.</h1>
    <p>Vuelvo a la mañana.<br>Lo que pase de noche puede esperar.</p>
  </div>
  <footer>Mantené apretado el botón de encendido 30 s para salir del dashboard.</footer>
</div></body></html>
